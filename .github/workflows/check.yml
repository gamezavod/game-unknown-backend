name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: gamezavod_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/gamezavod_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/gamezavod_test
      JWT_SECRET: ci-only-public-test-key-never-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests migrations scripts
      - run: uv run python scripts/check.py
